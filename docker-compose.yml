version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sptc-postgres
    restart: always
    environment:
      POSTGRES_USER: sptc
      POSTGRES_PASSWORD: sptc_dev_password
      POSTGRES_DB: sptc_finance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sptc -d sptc_finance"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: sptc-backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - apps/backend/.env
    environment:
      DATABASE_URL: "postgresql://sptc:sptc_dev_password@postgres:5432/sptc_finance?schema=public"
      JWT_ACCESS_SECRET: "a8f9c2e1b4d7e3f6a9c2e5b8d1e4f7a0c3e6b9d2e5f8a1c4e7b0d3e6f9a2c5b8"
      JWT_REFRESH_SECRET: "b9f0d3e2c5e8f7a0b3d6c9e2f5a8b1d4e7f0a3c6b9e2f5a8b1d4e7f0a3c6b9e2"
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "30d"
      OTP_TTL_SECONDS: "300"
      OTP_MAX_ATTEMPTS: "5"
      OTP_RESEND_COOLDOWN_SECONDS: "45"
      OTP_MAX_REQUESTS_PER_HOUR: "5"
      SMS_PROVIDER: ""
      PUSH_PROVIDER: "expo"
      PAYMENT_GATEWAY_PROVIDER: ""
      PORT: "3000"
      NODE_ENV: "development"
      CORS_ORIGINS: "http://localhost:19006,http://localhost:3000,http://localhost:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
